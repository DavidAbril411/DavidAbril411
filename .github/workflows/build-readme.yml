name: Build profile README

on:
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/**'
      - '.github/workflows/build-readme.yml'
  schedule:
    # Twice a day. The build is content-addressed, so a run that finds nothing
    # new leaves the tree byte-identical and commits nothing.
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh GitHub stats
        env:
          # PROFILE_TOKEN is optional: add a read-only PAT if the default token
          # ever stops returning the contribution totals.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs

      - name: Generate cards and README
        run: |
          node scripts/gen-hero.mjs
          node scripts/gen-skills.mjs
          node scripts/gen-terminal.mjs
          node scripts/build-readme.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets profile/data/stats.json
          if git diff --staged --quiet; then
            echo "nothing changed — no commit"
          else
            git commit -m "chore(profile): refresh generated README and cards"
            git push
          fi
