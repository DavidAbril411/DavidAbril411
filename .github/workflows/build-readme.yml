name: Build profile README

on:
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/**'
      - '.github/workflows/build-readme.yml'
  schedule:
    # Twice a day. The build is content-addressed, so a run that finds nothing
    # new leaves the tree byte-identical and commits nothing.
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh GitHub stats
        env:
          # PROFILE_TOKEN is optional: add a read-only PAT if the default token
          # ever stops returning the contribution totals.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs

      - name: Generate cards and README
        run: npm run cards && npm run readme

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets profile/data/stats.json
          if git diff --staged --quiet; then
            echo "nothing changed — no commit"
            exit 0
          fi
          git commit -m "chore(profile): refresh generated README and cards"
          # The snake and the README build can finish seconds apart, so a push
          # can lose the race. Rebase onto whatever landed first and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — rebasing onto origin/main"
            git pull --rebase origin main || exit 1
            # profile/** may have moved while this job was running, so drop
            # this commit and rebuild from the rebased sources: carrying the
            # old generated files forward would publish output that no longer
            # matches its input. --soft keeps the freshly fetched stats.json.
            git reset --soft HEAD^
            npm run cards && npm run readme
            git add README.md assets profile/data/stats.json
            if git diff --staged --quiet; then
              echo "the rebased tree already carries these changes — nothing to push"
              exit 0
            fi
            git commit -m "chore(profile): refresh generated README and cards"
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
