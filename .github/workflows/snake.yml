name: Contribution snake

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      # A palette change has to reach the snake too, or it keeps the old
      # colours until the next nightly run.
      - 'profile/data/theme.json'

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the active palette
        id: palette
        run: |
          node -e "
            const t = require('./profile/data/theme.json');
            const p = t.palettes[t.active].snake;
            const dots = p.dots.map(d => '%23' + d).join(',');
            console.log('query=color_snake=%23' + p.snake + '&color_dots=' + dots);
          " >> "$GITHUB_OUTPUT"

      - name: Render the snake in the profile palette
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?${{ steps.palette.outputs.query }}

      - name: Commit if the snake changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --staged --quiet; then
            echo "nothing changed — no commit"
            exit 0
          fi
          git commit -m "chore(profile): refresh contribution snake"
          # The snake and the README build can finish seconds apart, so a push
          # can lose the race. Rebase onto whatever landed first and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — rebasing onto origin/main"
            git pull --rebase origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
