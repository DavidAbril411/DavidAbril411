<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Contribution snake — pending first build">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0817"/><stop offset="1" stop-color="#191033"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="180" rx="20" fill="url(#sbg)"/>
  <rect width="1000" height="180" rx="20" fill="none" stroke="rgba(167,139,250,0.22)"/>
  <g transform="translate(500 84)">
    <text text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" fill="#cfc6e8">the snake is generated by GitHub Actions</text>
    <text text-anchor="middle" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#9b92b8">run the &quot;Contribution snake&quot; workflow once and this frame fills with a year of commits</text>
    <g transform="translate(-60 -44)">
      <rect width="14" height="14" rx="3" fill="#4c1d95"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="22" width="14" height="14" rx="3" fill="#6c469f"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="44" width="14" height="14" rx="3" fill="#927ac4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="66" width="14" height="14" rx="3" fill="#a78bfa"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="88" width="14" height="14" rx="3" fill="#c4b5fd"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
