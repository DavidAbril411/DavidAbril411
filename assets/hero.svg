<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="David Abril Perrig — Full-Stack Developer">
  <title>David Abril Perrig — Full-Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0817"/>
      <stop offset="0.55" stop-color="#191033"/>
      <stop offset="1" stop-color="#241546"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2eeff"/>
      <stop offset="0.42" stop-color="#f2eeff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.58" stop-color="#f2eeff"/>
      <stop offset="1" stop-color="#f2eeff"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="0.65" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <mask id="gridFade">
      <radialGradient id="gf" cx="0.5" cy="0.5" r="0.62">
        <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <rect width="1000" height="300" fill="url(#gf)"/>
    </mask>
    <clipPath id="card"><rect width="1000" height="300" rx="24"/></clipPath>
    <clipPath id="type0"><rect x="202" y="187" height="24.65" width="0"><animate attributeName="width" values="0;204;204;0;0" keyTimes="0;0.068;0.172;0.2;1" dur="19s" repeatCount="indefinite"/></rect></clipPath><clipPath id="type1"><rect x="202" y="187" height="24.65" width="0"><animate attributeName="width" values="0;0;346.8;346.8;0;0" keyTimes="0;0.2;0.268;0.372;0.4;1" dur="19s" repeatCount="indefinite"/></rect></clipPath><clipPath id="type2"><rect x="202" y="187" height="24.65" width="0"><animate attributeName="width" values="0;0;367.2;367.2;0;0" keyTimes="0;0.4;0.468;0.572;0.6;1" dur="19s" repeatCount="indefinite"/></rect></clipPath><clipPath id="type3"><rect x="202" y="187" height="24.65" width="0"><animate attributeName="width" values="0;0;377.4;377.4;0;0" keyTimes="0;0.6;0.668;0.772;0.8;1" dur="19s" repeatCount="indefinite"/></rect></clipPath><clipPath id="type4"><rect x="202" y="187" height="24.65" width="0"><animate attributeName="width" values="0;0;346.8;346.8;0" keyTimes="0;0.8;0.868;0.972;1" dur="19s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle cx="190" cy="90" r="130" fill="#6c469f" filter="url(#soft)" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0; 120 60; -72 24; 0 0" dur="22s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/></circle>
    <circle cx="760" cy="220" r="150" fill="#3b2a6b" filter="url(#soft)" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0; -140 -70; 84 -28; 0 0" dur="26s" begin="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/></circle>
    <circle cx="520" cy="40" r="110" fill="#4c1d95" filter="url(#soft)" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0; 90 120; -54 48; 0 0" dur="30s" begin="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/></circle>
    <g mask="url(#gridFade)" opacity="0.72"><line x1="0" y1="0" x2="0" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="40" y1="0" x2="40" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="80" y1="0" x2="80" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="120" y1="0" x2="120" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="160" y1="0" x2="160" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="200" y1="0" x2="200" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="240" y1="0" x2="240" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="280" y1="0" x2="280" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="320" y1="0" x2="320" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="360" y1="0" x2="360" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="400" y1="0" x2="400" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="440" y1="0" x2="440" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="480" y1="0" x2="480" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="520" y1="0" x2="520" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="560" y1="0" x2="560" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="600" y1="0" x2="600" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="640" y1="0" x2="640" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="680" y1="0" x2="680" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="720" y1="0" x2="720" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="760" y1="0" x2="760" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="800" y1="0" x2="800" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="840" y1="0" x2="840" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="880" y1="0" x2="880" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="920" y1="0" x2="920" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="960" y1="0" x2="960" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="1000" y1="0" x2="1000" y2="300" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="40" x2="1000" y2="40" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="80" x2="1000" y2="80" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="120" x2="1000" y2="120" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="160" x2="1000" y2="160" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="200" x2="1000" y2="200" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="240" x2="1000" y2="240" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/><line x1="0" y1="280" x2="1000" y2="280" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/></g>

    <!-- light sweeping across the card -->
    <rect x="-420" y="0" width="420" height="300" fill="url(#sweep)" opacity="0.32">
      <animate attributeName="x" values="-420;1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- monogram -->
    <g transform="translate(108 150)">
      <circle r="52" fill="none" stroke="url(#ring)" stroke-width="1.6" stroke-dasharray="6 10" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="43" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="70 200" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="36" fill="rgba(255,255,255,0.075)" stroke="rgba(167,139,250,0.22)"/>
      <text text-anchor="middle" y="11" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="url(#shimmer)">DA</text>
    </g>

    <!-- identity -->
    <text x="202" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" letter-spacing="3.4" fill="#a78bfa" opacity="0.95">FULL-STACK DEVELOPER &#183; CÓRDOBA, ARGENTINA</text>
    <text x="200" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="url(#shimmer)">David Abril Perrig</text>
    <text x="202" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9b92b8">I ship products end-to-end — from PostGIS queries to the App Store listing.</text>

    <text x="182" y="204" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#5eead4">&#8250;</text>
    <text x="202" y="204" clip-path="url(#type0)" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#cfc6e8">Full-Stack Developer</text><text x="202" y="204" clip-path="url(#type1)" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#cfc6e8">React Native · NestJS · PostgreSQL</text><text x="202" y="204" clip-path="url(#type2)" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#cfc6e8">AI engineering with evals, not vibes</text><text x="202" y="204" clip-path="url(#type3)" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#cfc6e8">Founder @ Cappy · Calei · Abril Codes</text><text x="202" y="204" clip-path="url(#type4)" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#cfc6e8">Open to remote roles across the EU</text><rect y="189" width="2.5" height="18.02" rx="1.25" fill="#a78bfa" x="202"><animate attributeName="x" values="202;406;406;202;548.8;548.8;202;569.2;569.2;202;579.4;579.4;202;548.8;548.8;202" keyTimes="0;0.068;0.172;0.2;0.268;0.372;0.4;0.468;0.572;0.6;0.668;0.772;0.8;0.868;0.972;1" dur="19s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.05s" repeatCount="indefinite"/></rect>

    <g transform="translate(200 234)"><rect width="167.95" height="28" rx="14" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="15" cy="14" r="3.5" fill="#7dd3fc"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="26" y="18.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#cfc6e8">Graduating Dec 2026</text></g><g transform="translate(377.95 234)"><rect width="238.45" height="28" rx="14" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="15" cy="14" r="3.5" fill="#5eead4"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="26" y="18.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#cfc6e8">EU citizen · Italian passport</text></g><g transform="translate(626.4 234)"><rect width="210.25" height="28" rx="14" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="15" cy="14" r="3.5" fill="#f0abfc"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="26" y="18.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#cfc6e8">Open to remote roles · EU</text></g>

    <rect width="1000" height="300" rx="24" fill="none" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
    <rect x="24" y="0" width="952" height="1.4" fill="url(#edge)"/>
  </g>
</svg>
