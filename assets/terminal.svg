<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="446" viewBox="0 0 1000 446" role="img" aria-label="Terminal-style profile summary">
  <title>gitfetch --profile</title>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04051a"/>
      <stop offset="1" stop-color="#0a0f33"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="termGlow" cx="0.12" cy="0.9" r="0.8">
      <stop offset="0" stop-color="#2a34c9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a34c9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="termCard"><rect width="1000" height="446" rx="16"/></clipPath>
    <clipPath id="ribbonClip"><rect width="1000" height="8" rx="4"/></clipPath>
    <clipPath id="promptClip">
      <rect x="236" y="0" width="0" height="446">
        <animate attributeName="width" values="0;283.5" dur="1.1s" begin="0.15s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#termCard)">
    <rect width="1000" height="446" fill="url(#termBg)"/>
    <rect width="1000" height="446" fill="url(#termGlow)"/>

    <!-- window chrome -->
    <rect width="1000" height="40" fill="rgba(255,255,255,0.04)"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="rgba(255,255,255,0.09)"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="20" r="6" fill="#febc2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <text x="500" y="24.5" text-anchor="middle" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#9b92b8">david@abrilcodes — zsh</text>

    <!-- prompt art column -->
    <g transform="translate(26 66)">
      <rect width="174" height="354" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/>
      <g transform="translate(87 177)">
        <g transform="translate(0 -70)">
          <circle r="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-dasharray="4 8">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
          </circle>
          <text text-anchor="middle" y="7" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#cfc6e8">DA</text>
        </g>
        <g transform="translate(-14 0)">
          <text text-anchor="middle" y="10" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="70" font-weight="700" fill="url(#promptGrad)">&#8250;</text>
          <rect x="14" y="-6" width="30" height="6" rx="3" fill="url(#promptGrad)">
            <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
        <text text-anchor="middle" y="52" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" letter-spacing="1.4" fill="#9b92b8">SHIP · MEASURE · SHIP</text>
      </g>
    </g>

    <!-- typed command -->
    <g clip-path="url(#promptClip)">
      <text x="236" y="60" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#9b92b8">david@github ~ $ gitfetch --profile</text>
    </g>
    <rect y="49" width="7.5" height="15" fill="#7c8cff" opacity="0.85" x="236">
      <animate attributeName="x" values="236;519.5" dur="1.1s" begin="0.15s" fill="freeze"/>
      <animate attributeName="opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="236" y="84" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#7c8cff">DavidAbril411<tspan fill="#9b92b8">@</tspan><tspan fill="#38bdf8">github</tspan></text>
